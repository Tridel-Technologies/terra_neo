<div class="base-main">
  <app-header [index]="index"></app-header>

  <!-- license expired message -->
  <div class="license-card-container" *ngIf="licenseExpired">
    <div class="card">
      <p-message closable severity="error">
        Your license will expire in {{ remainingDays }} days
      </p-message>
    </div>
  </div>

  <div class="bodyy">
    <app-importer [timezone]="timezone" *ngIf="index === 0"></app-importer>
    <!-- <app-processing *ngIf="index ===1"> -->
    <!-- <app-importer></app-importer> -->
    <!-- </app-processing> -->
    <app-dashboard
      [timezone]="timezone"
      *ngIf="index === 1"
      [dir]="dir_enable"
    ></app-dashboard>
    <app-analytics [timezone]="timezone" *ngIf="index === 2"></app-analytics>
    <app-reports [timezone]="timezone" *ngIf="index === 3"></app-reports>
    <app-settings [timezone]="timezone" *ngIf="index === 4"></app-settings>
  </div>
</div>
