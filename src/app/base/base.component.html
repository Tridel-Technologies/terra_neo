<div class="base-main">
  <app-header [index]="index"></app-header>

  <!-- license expired message -->
  <div class="license-card-container" *ngIf="licenseExpired">
    <div class="card">
      <p-message closable severity="warn">
        Your license will expire in {{ remainingDays }} days
      </p-message>
    </div>
  </div>

  <div class="bodyy">
    <app-importer *ngIf="index === 0"></app-importer>
    <!-- <app-processing *ngIf="index ===1"> -->
    <!-- <app-importer></app-importer> -->
    <!-- </app-processing> -->
    <app-dashboard *ngIf="index === 1"></app-dashboard>
    <app-analytics *ngIf="index === 2"></app-analytics>
    <app-reports *ngIf="index === 3"></app-reports>
    <app-settings *ngIf="index === 4"></app-settings>
  </div>
</div>
